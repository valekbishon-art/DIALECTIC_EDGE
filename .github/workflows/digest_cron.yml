name: daily-digest-cron

# Two scheduled jobs:
#   1. generate  (05:50 UTC = 08:50 MSK) — pre-generate today's digest, cache it
#      in PostgreSQL (Neon) AND push a fallback copy to the GitHub data table.
#      Ready by 09:00 MSK.
#   2. broadcast-fallback (06:05 UTC = 09:05 MSK) — safety net. Only sends if the
#      always-on bot (Railway scheduler) did NOT already broadcast at 09:00 MSK
#      (tracked via daily_digests.broadcast_done).
#
# All app credentials come from ONE secret, RAILWAY_ENV: paste the full Railway
# env (KEY=VALUE lines, e.g. from Railway → Variables → Raw Editor) into a single
# repo secret named RAILWAY_ENV. The workflow writes it to .env and the scripts
# load it via python-dotenv. (GitHub caps repos at 100 individual secrets, so a
# single dotenv secret is the clean way to ship 100+ variables.)

on:
  schedule:
    - cron: '50 5 * * *'   # 08:50 MSK — generate digest
    - cron: '5 6 * * *'    # 09:05 MSK — broadcast fallback
  workflow_dispatch:
    inputs:
      task:
        description: "Which task to run manually"
        required: true
        default: generate
        type: choice
        options:
          - generate
          - broadcast

concurrency:
  group: digest-cron
  cancel-in-progress: false

permissions:
  contents: write   # allow pushing the fallback digest to the data branch

jobs:
  generate:
    name: Generate daily digest
    # Run on the 08:50 schedule, or on manual dispatch with task=generate.
    if: >-
      github.event_name == 'schedule' && github.event.schedule == '50 5 * * *'
      || github.event_name == 'workflow_dispatch' && inputs.task == 'generate'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # GitHub-table fallback for the digest (push to data branch). GITHUB_TOKEN
      # is auto-provided by Actions; GITHUB_REPO is the current repo. These are
      # set at job level so they win over anything in the .env (dotenv does not
      # override existing OS env vars).
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPO: ${{ github.repository }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write Railway env to .env
        env:
          RAILWAY_ENV: ${{ secrets.RAILWAY_ENV }}
        run: |
          cat > .env << 'EOF'
          ${{ secrets.RAILWAY_ENV }}
          EOF

      - name: Generate & cache digest
        run: python cron_digest.py

  broadcast-fallback:
    name: Broadcast digest (fallback)
    # Run on the 09:05 schedule, or on manual dispatch with task=broadcast.
    if: >-
      github.event_name == 'schedule' && github.event.schedule == '5 6 * * *'
      || github.event_name == 'workflow_dispatch' && inputs.task == 'broadcast'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write Railway env to .env
        env:
          RAILWAY_ENV: ${{ secrets.RAILWAY_ENV }}
        run: |
          cat > .env << 'EOF'
          ${{ secrets.RAILWAY_ENV }}
          EOF

      - name: Broadcast digest if the live bot did not (fallback)
        run: python cron_broadcast.py
