name: daily-digest-cron

# Pre-generate daily digest at 05:50 UTC (08:50 MSK).
# Result is cached in PostgreSQL — bot serves it instantly to users.

on:
  schedule:
    # 05:50 UTC = 08:50 MSK. Digest ready by 09:00 MSK.
    - cron: '50 5 * * *'
  workflow_dispatch: {}  # manual trigger for testing

concurrency:
  group: digest-cron
  cancel-in-progress: true

jobs:
  generate:
    name: Generate daily digest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      AI_PROVIDER: ${{ secrets.AI_PROVIDER }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
      GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_API_KEY_2: ${{ secrets.OPENROUTER_API_KEY_2 }}
      OPENROUTER_API_KEY_3: ${{ secrets.OPENROUTER_API_KEY_3 }}
      OPENROUTER_API_KEY_4: ${{ secrets.OPENROUTER_API_KEY_4 }}
      OPENROUTER_API_KEY_5: ${{ secrets.OPENROUTER_API_KEY_5 }}
      OPENROUTER_API_KEY_6: ${{ secrets.OPENROUTER_API_KEY_6 }}
      OPENROUTER_API_KEY_7: ${{ secrets.OPENROUTER_API_KEY_7 }}
      OPENROUTER_API_KEY_8: ${{ secrets.OPENROUTER_API_KEY_8 }}
      OPENROUTER_API_KEY_9: ${{ secrets.OPENROUTER_API_KEY_9 }}
      OPENROUTER_API_KEY_10: ${{ secrets.OPENROUTER_API_KEY_10 }}
      OPENROUTER_API_KEY_11: ${{ secrets.OPENROUTER_API_KEY_11 }}
      OPENROUTER_API_KEY_12: ${{ secrets.OPENROUTER_API_KEY_12 }}
      OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
      OPENROUTER_BULL_MODEL: ${{ secrets.OPENROUTER_BULL_MODEL }}
      OPENROUTER_BEAR_MODEL: ${{ secrets.OPENROUTER_BEAR_MODEL }}
      OPENROUTER_VERIFIER_MODEL: ${{ secrets.OPENROUTER_VERIFIER_MODEL }}
      OPENROUTER_SYNTH_MODEL: ${{ secrets.OPENROUTER_SYNTH_MODEL }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
      TOGETHER_API_KEY_2: ${{ secrets.TOGETHER_API_KEY_2 }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      MISTRAL_API_KEY_2: ${{ secrets.MISTRAL_API_KEY_2 }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      DEBATE_ROUNDS: "2"
      MAX_TOKENS: "1500"
      AGENT_TEMP: "0.4"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate & cache digest
        run: python cron_digest.py
