name: daily-digest-cron

# Two scheduled jobs:
#   1. generate  (05:50 UTC = 08:50 MSK) — pre-generate today's digest, cache it
#      in PostgreSQL (Neon) AND push a fallback copy to the GitHub data table.
#      Ready by 09:00 MSK.
#   2. broadcast-fallback (06:05 UTC = 09:05 MSK) — safety net. Only sends if the
#      always-on bot (Railway scheduler) did NOT already broadcast at 09:00 MSK
#      (tracked via daily_digests.broadcast_done).

on:
  schedule:
    - cron: '50 5 * * *'   # 08:50 MSK — generate digest
    - cron: '5 6 * * *'    # 09:05 MSK — broadcast fallback
  workflow_dispatch:
    inputs:
      task:
        description: "Which task to run manually"
        required: true
        default: generate
        type: choice
        options:
          - generate
          - broadcast

concurrency:
  group: digest-cron
  cancel-in-progress: false

permissions:
  contents: write   # allow pushing the fallback digest to the data branch

jobs:
  generate:
    name: Generate daily digest
    # Run on the 08:50 schedule, or on manual dispatch with task=generate.
    if: >-
      github.event_name == 'schedule' && github.event.schedule == '50 5 * * *'
      || github.event_name == 'workflow_dispatch' && inputs.task == 'generate'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      AI_PROVIDER: ${{ secrets.AI_PROVIDER }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
      GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_API_KEY_2: ${{ secrets.OPENROUTER_API_KEY_2 }}
      OPENROUTER_API_KEY_3: ${{ secrets.OPENROUTER_API_KEY_3 }}
      OPENROUTER_API_KEY_4: ${{ secrets.OPENROUTER_API_KEY_4 }}
      OPENROUTER_API_KEY_5: ${{ secrets.OPENROUTER_API_KEY_5 }}
      OPENROUTER_API_KEY_6: ${{ secrets.OPENROUTER_API_KEY_6 }}
      OPENROUTER_API_KEY_7: ${{ secrets.OPENROUTER_API_KEY_7 }}
      OPENROUTER_API_KEY_8: ${{ secrets.OPENROUTER_API_KEY_8 }}
      OPENROUTER_API_KEY_9: ${{ secrets.OPENROUTER_API_KEY_9 }}
      OPENROUTER_API_KEY_10: ${{ secrets.OPENROUTER_API_KEY_10 }}
      OPENROUTER_API_KEY_11: ${{ secrets.OPENROUTER_API_KEY_11 }}
      OPENROUTER_API_KEY_12: ${{ secrets.OPENROUTER_API_KEY_12 }}
      OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
      OPENROUTER_BULL_MODEL: ${{ secrets.OPENROUTER_BULL_MODEL }}
      OPENROUTER_BEAR_MODEL: ${{ secrets.OPENROUTER_BEAR_MODEL }}
      OPENROUTER_VERIFIER_MODEL: ${{ secrets.OPENROUTER_VERIFIER_MODEL }}
      OPENROUTER_SYNTH_MODEL: ${{ secrets.OPENROUTER_SYNTH_MODEL }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
      TOGETHER_API_KEY_2: ${{ secrets.TOGETHER_API_KEY_2 }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      MISTRAL_API_KEY_2: ${{ secrets.MISTRAL_API_KEY_2 }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      # GitHub-table fallback for the digest (push to data branch).
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPO: ${{ github.repository }}
      DEBATE_ROUNDS: "2"
      MAX_TOKENS: "1500"
      AGENT_TEMP: "0.4"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate & cache digest
        run: python cron_digest.py

  broadcast-fallback:
    name: Broadcast digest (fallback)
    # Run on the 09:05 schedule, or on manual dispatch with task=broadcast.
    if: >-
      github.event_name == 'schedule' && github.event.schedule == '5 6 * * *'
      || github.event_name == 'workflow_dispatch' && inputs.task == 'broadcast'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Broadcast digest if the live bot did not (fallback)
        run: python cron_broadcast.py
